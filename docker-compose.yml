version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: train-booking-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: familyuser
      POSTGRES_DB: train_booking

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: